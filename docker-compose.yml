services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: servicios911
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicios911"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/servicios911?schema=public
      JWT_SECRET: 911-transportes-demo-secret-cambiar
      PORT: 4000
      UPLOAD_DIR: uploads
      PHOTO_RETENTION_DAYS: 365
      ALERT_OPEN_HOURS: 10
      FRONTEND_URL: http://localhost
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
